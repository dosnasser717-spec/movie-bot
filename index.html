<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Bot | واجهتك للترفيه</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #e50914;
            --body-bg: #06090f;
            --card-bg: #141414;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--body-bg);
            color: white;
            margin: 0;
            overflow-x: hidden;
        }

        /* Navbar */
        nav {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            position: fixed;
            width: 90%;
            z-index: 1000;
        }

        .logo { color: var(--primary-color); font-size: 24px; font-weight: bold; }

        /* Hero Section */
        .hero {
            height: 80vh;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            padding: 0 5%;
            position: relative;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 150px;
            background: linear-gradient(to top, var(--body-bg), transparent);
        }

        .hero-content { max-width: 600px; z-index: 2; }
        .hero-content h1 { font-size: 3rem; margin: 0; }
        .hero-content p { font-size: 1.1rem; color: #ccc; }

        /* Row Styling */
        .row { margin: 30px 0; padding: 0 5%; }
        .row h2 { font-size: 1.5rem; margin-bottom: 15px; }
        
        .posters-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 10px 0;
            scrollbar-width: none; /* Hide scrollbar Firefox */
        }

        .posters-container::-webkit-scrollbar { display: none; } /* Hide scrollbar Chrome/Safari */

        .movie-card {
            min-width: 160px;
            transition: transform 0.3s ease;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
        }

        .movie-card:hover { transform: scale(1.1); z-index: 10; }
        .movie-card img { width: 100%; border-radius: 8px; }

        /* Modal Player */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content { width: 80%; height: 80%; position: relative; }
        .close-btn {
            position: absolute; top: -40px; right: 0;
            color: white; font-size: 30px; cursor: pointer;
        }
        iframe { width: 100%; height: 100%; border: none; border-radius: 10px; }
    </style>
</head>
<body>

<nav>
    <div class="logo">MOVIE BOT 🤖</div>
</nav>

<section class="hero" id="hero">
    <div class="hero-content">
        <h1 id="hero-title">اسم الفيلم المميز</h1>
        <p id="hero-desc">وصف بسيط وشيق للفيلم المختار حالياً...</p>
    </div>
</section>

<div class="row">
    <h2>أفلام تريند 🔥</h2>
    <div class="posters-container" id="trending-row"></div>
</div>

<div class="row">
    <h2>أفلام الأكشن 💥</h2>
    <div class="posters-container" id="action-row"></div>
</div>

<div class="row">
    <h2>مسلسلات مختارة 📺</h2>
    <div class="posters-container" id="tv-row"></div>
</div>

<div class="modal" id="videoModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closePlayer()">&times;</span>
        <div id="player-container"></div>
   </div>
<div class="row">
    <h2>أفلام الرعب والغموض 👻</h2>
    <div class="posters-container" id="horror-row"></div>
</div>

<div class="row">
    <h2>عالم الأنمي والكرتون 🐉</h2>
    <div class="posters-container" id="anime-row"></div>
</div>

<div class="row">
    <h2>أفلام كوميدية 🍿</h2>
    <div class="posters-container" id="comedy-row"></div>
</div>
</div>

<script>
    const API_KEY = 'c2a4565c270e6801828b769a89614135';
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMG_URL = 'https://image.tmdb.org/t/p/original';

    // 1. جلب بيانات الصفحة الرئيسية (Hero)
    async function fetchHero() {
        const res = await fetch(`${BASE_URL}/trending/movie/day?api_key=${API_KEY}`);
        const data = await res.json();
        const movie = data.results[0];
        document.getElementById('hero').style.backgroundImage = `url(${IMG_URL + movie.backdrop_path})`;
        document.getElementById('hero-title').innerText = movie.title;
        document.getElementById('hero-desc').innerText = movie.overview.substring(0, 150) + "...";
    }

    // 2. وظيفة عامة لجلب الصفوف
    async function fetchRow(path, elementId, type = 'movie') {
        const res = await fetch(`${BASE_URL}${path}&api_key=${API_KEY}&language=ar`);
        const data = await res.json();
        const container = document.getElementById(elementId);

        data.results.forEach(item => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.onclick = () => openPlayer(item.id, type);
            card.innerHTML = `<img src="https://image.tmdb.org/t/p/w300${item.poster_path}" alt="${item.title || item.name}">`;
            container.appendChild(card);
        });
    }

    // 3. التحكم في المشغل
    function openPlayer(id, type) {
        const modal = document.getElementById('videoModal');
        const container = document.getElementById('player-container');
        // ملاحظة: vidsrc هو مزود خارجي للمشاهدة
        container.innerHTML = `<iframe src="https://vidsrc.me/embed/${type}?tmdb=${id}" allowfullscreen></iframe>`;
        modal.style.display = 'flex';
    }

    function closePlayer() {
        document.getElementById('videoModal').style.display = 'none';
        document.getElementById('player-container').innerHTML = '';
    }

    // تشغيل كل شيء عند التحميل
    window.onload = () => {
        fetchHero();
        fetchRow('/trending/all/week?', 'trending-row');
        fetchRow('/discover/movie?with_genres=28', 'action-row'); // Genre 28 = Action
        fetchRow('/discover/tv?sort_by=popularity.desc', 'tv-row', 'tv');
    };
    window.onload = () => {
    fetchHero();
    fetchRow('/trending/all/week?', 'trending-row');
    fetchRow('/discover/movie?with_genres=28', 'action-row'); // أكشن
    fetchRow('/discover/tv?sort_by=popularity.desc', 'tv-row', 'tv'); // مسلسلات
    
    // الأقسام الجديدة التي طلبتها:
    fetchRow('/discover/movie?with_genres=27', 'horror-row'); // 27 هو رقم الرعب
    fetchRow('/discover/movie?with_genres=16', 'anime-row');  // 16 هو رقم الأنمي والرسوم المتحركة
    fetchRow('/discover/movie?with_genres=35', 'comedy-row'); // 35 هو رقم الكوميديا
};
</script>

</body>
</html>
