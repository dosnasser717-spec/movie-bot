<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExoticN9 — أفلام ومسلسلات</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
nav{background:#0a0a0a;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1a1a1a;position:sticky;top:0;z-index:10}
.logo{font-size:20px;font-weight:700;color:#e50914;letter-spacing:2px}
.logo span{color:#fff;opacity:0.5}
.nav-tabs{display:flex;gap:6px}
.tab{padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;border:none;background:transparent;color:#888;transition:all 0.2s}
.tab.active{background:#1a1a1a;color:#fff}
.page{display:none}.page.active{display:block}
.hero{padding:20px;background:linear-gradient(180deg,#1a0505 0%,#0a0a0a 100%)}
.hero h1{font-size:24px;font-weight:700;margin-bottom:4px}
.hero p{font-size:14px;color:#888}
.search-wrap{padding:12px 20px}
.search-box{position:relative}
.search-box input{width:100%;padding:11px 44px 11px 16px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#fff;font-size:14px;outline:none;font-family:inherit}
.search-box input::placeholder{color:#555}
.search-box i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#555;font-size:20px}
.filters{display:flex;gap:8px;padding:0 20px 16px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-btn{padding:7px 16px;border-radius:20px;border:1px solid #2a2a2a;background:transparent;color:#888;font-size:13px;white-space:nowrap;cursor:pointer;transition:all 0.2s;flex-shrink:0}
.filter-btn.active{background:#e50914;border-color:#e50914;color:#fff}
.section{padding:0 20px 20px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:16px;font-weight:600}
.count-badge{font-size:12px;color:#e50914;background:#1a0000;padding:3px 10px;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:#1a1a1a;border-radius:12px;overflow:hidden;cursor:pointer;transition:transform 0.2s;border:1px solid #2a2a2a}
.card:hover{transform:translateY(-4px)}
.card-poster{width:100%;aspect-ratio:2/3;background:#2a2a2a;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.card-poster img{width:100%;height:100%;object-fit:cover}
.card-emoji{font-size:50px}
.badge{position:absolute;top:8px;right:8px;font-size:10px;padding:3px 8px;border-radius:5px;font-weight:600}
.badge.movie{background:#e50914;color:#fff}
.badge.series{background:#f5a623;color:#000}
.card-body{padding:10px}
.card-name{font-size:13px;font-weight:600;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:11px;color:#888;display:flex;gap:8px;margin-bottom:8px}
.star{color:#f5a623}
.watch-btn{width:100%;padding:7px;background:#e50914;border:none;border-radius:7px;color:#fff;font-size:12px;cursor:pointer;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px}
.empty{text-align:center;padding:60px 20px;color:#444;grid-column:1/-1}
.empty i{font-size:56px;display:block;margin-bottom:14px}
.loading{text-align:center;padding:40px;color:#555;grid-column:1/-1}
.spinner{width:40px;height:40px;border:3px solid #1a1a1a;border-top:3px solid #e50914;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:100;padding:20px;align-items:flex-start;justify-content:center;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:#181818;border-radius:14px;width:100%;max-width:400px;margin:auto;border:1px solid #2a2a2a;overflow:hidden;position:relative}
.modal-img{width:100%;height:220px;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:70px;overflow:hidden}
.modal-img img{width:100%;height:100%;object-fit:cover}
.modal-body{padding:18px}
.modal-title{font-size:20px;font-weight:700;margin-bottom:6px}
.modal-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;background:#2a2a2a;color:#aaa}
.tag.type{background:#e50914;color:#fff}
.modal-desc{font-size:14px;color:#aaa;line-height:1.7;margin-bottom:16px}
.modal-link{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;background:#e50914;border-radius:10px;color:#fff;font-size:15px;font-weight:600;text-decoration:none}
.close-btn{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.7);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.admin-top{padding:16px 20px;background:#0f0f0f;border-bottom:1px solid #1a1a1a}
.admin-top h2{font-size:16px;font-weight:600;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#1a1a1a;border-radius:10px;padding:12px;text-align:center;border:1px solid #2a2a2a}
.stat-num{font-size:22px;font-weight:700;color:#e50914}
.stat-label{font-size:11px;color:#666;margin-top:3px}
.admin-body{padding:20px}
.add-switch{display:flex;gap:8px;margin-bottom:16px}
.sw-btn{flex:1;padding:9px;border-radius:8px;border:1px solid #2a2a2a;background:transparent;color:#888;font-size:13px;cursor:pointer;transition:all 0.2s;text-align:center;font-family:inherit}
.sw-btn.active{background:#e50914;border-color:#e50914;color:#fff}
.type-switch{display:flex;gap:8px;margin-bottom:16px}
.type-btn{flex:1;padding:10px;border-radius:8px;border:2px solid #2a2a2a;background:#111;color:#888;font-size:14px;cursor:pointer;font-family:inherit;transition:all 0.2s}
.type-btn.active{background:#e50914;border-color:#e50914;color:#fff;font-weight:600}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:#777;margin-bottom:7px}
.form-group input,.form-group textarea{width:100%;padding:11px 14px;background:#1a1a1a;border:1px solid #333;border-radius:9px;color:#fff;font-size:14px;outline:none;font-family:inherit;transition:border 0.2s}
.form-group input:focus,.form-group textarea:focus{border-color:#e50914}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.add-btn{width:100%;padding:13px;background:#e50914;border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;margin-top:4px}
.add-btn:disabled{background:#555;cursor:not-allowed}
.bulk-box{background:#111;border:2px dashed #2a2a2a;border-radius:10px;padding:14px;margin-bottom:14px}
.bulk-hint{font-size:11px;color:#555;margin-bottom:10px;line-height:1.7}
.bulk-box textarea{width:100%;background:transparent;border:none;color:#ccc;font-family:monospace;font-size:12px;outline:none;resize:vertical;min-height:120px}
.divider{border:none;border-top:1px solid #1a1a1a;margin:20px 0}
.list-title{font-size:14px;font-weight:600;margin-bottom:12px;color:#888}
.list-item{background:#1a1a1a;border-radius:10px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border:1px solid #2a2a2a}
.list-icon{width:38px;height:38px;border-radius:8px;background:#2a0000;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.list-icon i{color:#e50914;font-size:20px}
.list-info{flex:1;min-width:0}
.list-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-sub{font-size:11px;color:#666;margin-top:3px}
.del-btn{background:transparent;border:none;color:#444;cursor:pointer;padding:6px;border-radius:6px;font-size:18px;flex-shrink:0}
.del-btn:hover{color:#e50914}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:11px 22px;border-radius:10px;font-size:13px;font-weight:600;display:none;z-index:999;white-space:nowrap}
.toast.success{background:#0d2a0d;color:#4caf50;border:1px solid #1a4a1a}
.toast.error{background:#2a0d0d;color:#f44336;border:1px solid #4a1a1a}
</style>
</head>
<body>
<nav>
  <div class="logo">EXOTIC<span>N9</span></div>
  <div class="nav-tabs">
    <button class="tab active" onclick="showPage('user',this)">🎬 العرض</button>
    <button class="tab" onclick="showPage('admin',this)">⚙️ الإدارة</button>
  </div>
</nav>

<!-- صفحة العرض -->
<div class="page active" id="page-user">
  <div class="hero"><h1>🎬 أفلام ومسلسلات</h1><p>اكتشف أفضل المحتوى المختار</p></div>
  <div class="search-wrap">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل..." oninput="filterContent()">
      <i class="ti ti-search"></i>
    </div>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">🌟 الكل</button>
    <button class="filter-btn" onclick="setFilter('movie',this)">🎬 أفلام</button>
    <button class="filter-btn" onclick="setFilter('series',this)">📺 مسلسلات</button>
    <button class="filter-btn" onclick="setFilter('top',this)">⭐ الأعلى تقييماً</button>
  </div>
  <div class="section">
    <div class="section-header">
      <div class="section-title">المحتوى المتاح</div>
      <div class="count-badge" id="count-badge">0 عنصر</div>
    </div>
    <div class="grid" id="contentGrid">
      <div class="loading"><div class="spinner"></div><div>جاري التحميل...</div></div>
    </div>
  </div>
</div>

<!-- صفحة الإدارة -->
<div class="page" id="page-admin">
  <div class="admin-top">
    <h2>⚙️ لوحة التحكم</h2>
    <div class="stats">
      <div class="stat"><div class="stat-num" id="s-movies">0</div><div class="stat-label">أفلام</div></div>
      <div class="stat"><div class="stat-num" id="s-series">0</div><div class="stat-label">مسلسلات</div></div>
      <div class="stat"><div class="stat-num" id="s-total">0</div><div class="stat-label">الإجمالي</div></div>
    </div>
  </div>
  <div class="admin-body">
    <div class="add-switch">
      <button class="sw-btn active" onclick="setTab('single',this)">➕ إضافة واحد</button>
      <button class="sw-btn" onclick="setTab('bulk',this)">📋 إضافة دفعة</button>
    </div>

    <!-- إضافة واحد -->
    <div id="tab-single">
      <div class="type-switch">
        <button class="type-btn active" id="btn-movie" onclick="setType('movie')">🎬 فيلم</button>
        <button class="type-btn" id="btn-series" onclick="setType('series')">📺 مسلسل</button>
      </div>

      <div class="form-group">
        <label>الاسم *</label>
        <input type="text" id="f-name" placeholder="اسم الفيلم أو المسلسل">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>السنة</label>
          <input type="text" id="f-year" placeholder="2024">
        </div>
        <div class="form-group">
          <label>التقييم (من 10)</label>
          <input type="text" id="f-rating" placeholder="8.5">
        </div>
      </div>

      <div id="series-fields" style="display:none">
        <div class="form-row">
          <div class="form-group">
            <label>عدد المواسم</label>
            <input type="text" id="f-seasons" placeholder="3">
          </div>
          <div class="form-group">
            <label>عدد الحلقات</label>
            <input type="text" id="f-episodes" placeholder="30">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>الوصف</label>
        <textarea id="f-desc" placeholder="وصف مختصر للمحتوى..."></textarea>
      </div>

      <div class="form-group">
        <label>رابط المشاهدة / التحميل *</label>
        <input type="text" id="f-link" placeholder="https://...">
      </div>

      <div class="form-group">
        <label>رابط صورة البوستر</label>
        <input type="text" id="f-poster" placeholder="https://...poster.jpg">
      </div>

      <button class="add-btn" id="add-btn" onclick="addSingle()">
        <i class="ti ti-plus"></i> إضافة
      </button>
    </div>

    <!-- إضافة دفعة -->
    <div id="tab-bulk" style="display:none">
      <div class="bulk-box">
        <div class="bulk-hint">
          📌 كل سطر = عنصر واحد بالتنسيق:<br>
          <strong>الاسم | السنة | التقييم | النوع | الرابط | الوصف</strong><br>
          النوع: movie أو series
        </div>
        <textarea id="bulk-input" placeholder="The Dark Knight | 2008 | 9.0 | movie | https://... | باتمان يواجه الجوكر
Inception | 2010 | 8.8 | movie | https://... | رحلة داخل الأحلام
Breaking Bad | 2008 | 9.5 | series | https://... | كيميائي يصنع المخدرات"></textarea>
      </div>
      <button class="add-btn" id="bulk-btn" onclick="addBulk()">
        <i class="ti ti-upload"></i> رفع الدفعة
      </button>
    </div>

    <hr class="divider">
    <div class="list-title">📦 المحتوى المضاف (<span id="list-count">0</span>)</div>
    <div id="adminList"></div>
  </div>
</div>

<!-- المودال -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal">
    <button class="close-btn" onclick="document.getElementById('overlay').classList.remove('show')">
      <i class="ti ti-x"></i>
    </button>
    <div class="modal-img" id="modal-img">🎬</div>
    <div class="modal-body">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-tags" id="modal-tags"></div>
      <div class="modal-desc" id="modal-desc"></div>
      <a class="modal-link" id="modal-link" href="#" target="_blank">
        <i class="ti ti-player-play"></i> مشاهدة / تحميل
      </a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://gtgfxkqncfxoxyqgegzh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0Z2Z4a3FuY2Z4b3h5cWdlZ3poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MTY1NzcsImV4cCI6MjA5Mzk5MjU3N30.kYG_2W79ntRu04PXdvcWfXkkSUB5655A_Pu1mSZ5Cf8';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let db = [];
let activeFilter = 'all';
let addType = 'movie';

// تحميل البيانات
async function loadData() {
  const { data, error } = await sb.from('content').select('*').order('id', { ascending: false });
  if (error) { showToast('❌ خطأ في التحميل: ' + error.message, 'error'); return; }
  db = data || [];
  filterContent();
}

// التنقل بين الصفحات
function showPage(p, btn) {
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.getElementById('page-' + p).classList.add('active');
  btn.classList.add('active');
  if (p === 'admin') renderAdmin();
  if (p === 'user') filterContent();
}

// الفلاتر
function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
  btn.classList.add('active');
  filterContent();
}

function filterContent() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let items = [...db];
  if (activeFilter === 'movie') items = items.filter(x => x.type === 'movie');
  else if (activeFilter === 'series') items = items.filter(x => x.type === 'series');
  else if (activeFilter === 'top') items = items.filter(x => parseFloat(x.rating) >= 8).sort((a, b) => parseFloat(b.rating) - parseFloat(a.rating));
  if (q) items = items.filter(x => (x.name || '').toLowerCase().includes(q) || (x.description || '').toLowerCase().includes(q));
  renderGrid(items);
}

// عرض البطاقات
function renderGrid(items) {
  const g = document.getElementById('contentGrid');
  document.getElementById('count-badge').textContent = items.length + ' عنصر';
  if (!items.length) {
    g.innerHTML = '<div class="empty"><i class="ti ti-search"></i><div>لا توجد نتائج</div></div>';
    return;
  }
  g.innerHTML = items.map(item => `
    <div class="card" onclick="openModal(${item.id})">
      <div class="card-poster">
        ${item.poster ? `<img src="${item.poster}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
        <div class="card-emoji" ${item.poster ? 'style="display:none"' : ''}>${item.type === 'movie' ? '🎬' : '📺'}</div>
        <div class="badge ${item.type}">${item.type === 'movie' ? 'فيلم' : 'مسلسل'}</div>
      </div>
      <div class="card-body">
        <div class="card-name">${item.name}</div>
        <div class="card-meta">
          ${item.year ? `<span>${item.year}</span>` : ''}
          ${item.rating ? `<span class="star">⭐${item.rating}</span>` : ''}
        </div>
        <button class="watch-btn"><i class="ti ti-player-play"></i> مشاهدة</button>
      </div>
    </div>
  `).join('');
}

// فتح المودال
function openModal(id) {
  const item = db.find(x => x.id === id);
  if (!item) return;
  const img = document.getElementById('modal-img');
  img.innerHTML = item.poster
    ? `<img src="${item.poster}" onerror="this.parentNode.innerHTML='${item.type === 'movie' ? '🎬' : '📺'}'">` 
    : (item.type === 'movie' ? '🎬' : '📺');
  document.getElementById('modal-title').textContent = item.name;
  let tags = `<span class="tag type">${item.type === 'movie' ? '🎬 فيلم' : '📺 مسلسل'}</span>`;
  if (item.year) tags += `<span class="tag">📅 ${item.year}</span>`;
  if (item.rating) tags += `<span class="tag">⭐ ${item.rating}/10</span>`;
  if (item.seasons) tags += `<span class="tag">📂 ${item.seasons} مواسم</span>`;
  if (item.episodes) tags += `<span class="tag">📋 ${item.episodes} حلقة</span>`;
  document.getElementById('modal-tags').innerHTML = tags;
  document.getElementById('modal-desc').textContent = item.description || 'لا يوجد وصف';
  document.getElementById('modal-link').href = item.link || '#';
  document.getElementById('overlay').classList.add('show');
}

function closeModal(e) {
  if (e.target === document.getElementById('overlay')) document.getElementById('overlay').classList.remove('show');
}

// التبويبات
function setTab(t, btn) {
  document.querySelectorAll('.add-switch .sw-btn').forEach(x => x.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-single').style.display = t === 'single' ? 'block' : 'none';
  document.getElementById('tab-bulk').style.display = t === 'bulk' ? 'block' : 'none';
}

// تغيير النوع
function setType(t) {
  addType = t;
  document.getElementById('btn-movie').classList.toggle('active', t === 'movie');
  document.getElementById('btn-series').classList.toggle('active', t === 'series');
  document.getElementById('series-fields').style.display = t === 'series' ? 'block' : 'none';
}

// إضافة واحد
async function addSingle() {
  const name = document.getElementById('f-name').value.trim();
  const link = document.getElementById('f-link').value.trim();
  const year = document.getElementById('f-year').value.trim();
  const rating = document.getElementById('f-rating').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  const poster = document.getElementById('f-poster').value.trim();
  const seasons = document.getElementById('f-seasons').value.trim();
  const episodes = document.getElementById('f-episodes').value.trim();

  if (!name) { showToast('⚠️ أدخل اسم المحتوى', 'error'); return; }
  if (!link) { showToast('⚠️ أدخل رابط المشاهدة', 'error'); return; }

  const btn = document.getElementById('add-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader"></i> جاري الإضافة...';

  const { error } = await sb.from('content').insert([{
    type: addType, name, year, rating,
    description: desc, link, poster, seasons, episodes
  }]);

  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-plus"></i> إضافة';

  if (error) {
    showToast('❌ خطأ: ' + error.message, 'error');
    return;
  }

  ['f-name','f-year','f-rating','f-desc','f-link','f-poster','f-seasons','f-episodes']
    .forEach(id => document.getElementById(id).value = '');

  showToast('✅ تم الإضافة بنجاح!', 'success');
  await loadData();
  renderAdmin();
}

// إضافة دفعة
async function addBulk() {
  const lines = document.getElementById('bulk-input').value.split('\n').filter(l => l.trim());
  const items = [];

  lines.forEach(line => {
    const parts = line.split('|').map(x => x.trim());
    if (parts[0] && parts[4]) {
      items.push({
        name: parts[0],
        year: parts[1] || '',
        rating: parts[2] || '',
        type: parts[3] === 'series' ? 'series' : 'movie',
        link: parts[4],
        description: parts[5] || '',
        poster: parts[6] || ''
      });
    }
  });

  if (!items.length) { showToast('⚠️ تحقق من التنسيق', 'error'); return; }

  const btn = document.getElementById('bulk-btn');
  btn.disabled = true;
  btn.innerHTML = `<i class="ti ti-loader"></i> جاري رفع ${items.length} عنصر...`;

  const { error } = await sb.from('content').insert(items);
  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-upload"></i> رفع الدفعة';

  if (error) { showToast('❌ خطأ: ' + error.message, 'error'); return; }

  document.getElementById('bulk-input').value = '';
  showToast(`✅ تم إضافة ${items.length} عنصر!`, 'success');
  await loadData();
  renderAdmin();
}

// حذف
async function deleteItem(id) {
  if (!confirm('هل تريد حذف هذا العنصر؟')) return;
  const { error } = await sb.from('content').delete().eq('id', id);
  if (error) { showToast('❌ خطأ في الحذف', 'error'); return; }
  showToast('🗑️ تم الحذف', 'success');
  await loadData();
  renderAdmin();
}

// عرض الإدارة
function renderAdmin() {
  document.getElementById('s-movies').textContent = db.filter(x => x.type === 'movie').length;
  document.getElementById('s-series').textContent = db.filter(x => x.type === 'series').length;
  document.getElementById('s-total').textContent = db.length;
  document.getElementById('list-count').textContent = db.length;
  const list = document.getElementById('adminList');
  if (!db.length) {
    list.innerHTML = '<div style="text-align:center;padding:30px;color:#555">لا يوجد محتوى بعد</div>';
    return;
  }
  list.innerHTML = db.map(item => `
    <div class="list-item">
      <div class="list-icon"><i class="ti ${item.type === 'movie' ? 'ti-movie' : 'ti-device-tv'}"></i></div>
      <div class="list-info">
        <div class="list-name">${item.name}</div>
        <div class="list-sub">${item.type === 'movie' ? 'فيلم' : 'مسلسل'}${item.year ? ' • ' + item.year : ''}${item.rating ? ' • ⭐' + item.rating : ''}</div>
      </div>
      <button class="del-btn" onclick="deleteItem(${item.id})"><i class="ti ti-trash"></i></button>
    </div>
  `).join('');
}

// التوست
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

// تشغيل
loadData();
</script>
