<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExoticN9 🎬</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
nav{background:#0a0a0a;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1a1a1a;position:sticky;top:0;z-index:10}
.logo{font-size:20px;font-weight:700;color:#e50914;letter-spacing:2px}
.logo span{color:#fff;opacity:0.5}
.nav-tabs{display:flex;gap:6px}
.tab{padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;border:none;background:transparent;color:#888}
.tab.active{background:#1a1a1a;color:#fff}
.page{display:none}.page.active{display:block}
.hero{padding:20px;background:linear-gradient(180deg,#1a0505,#0a0a0a)}
.hero h1{font-size:22px;font-weight:700}
.hero p{font-size:13px;color:#888;margin-top:4px}
.search-wrap{padding:12px 20px}
.search-box{position:relative}
.search-box input{width:100%;padding:11px 44px 11px 16px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#fff;font-size:14px;outline:none;font-family:inherit}
.search-box input::placeholder{color:#555}
.search-box i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#555;font-size:20px}
.filters{display:flex;gap:8px;padding:0 20px 16px;overflow-x:auto;scrollbar-width:none}
.filter-btn{padding:7px 16px;border-radius:20px;border:1px solid #2a2a2a;background:transparent;color:#888;font-size:12px;white-space:nowrap;cursor:pointer;flex-shrink:0}
.filter-btn.active{background:#e50914;border-color:#e50914;color:#fff}
.section{padding:0 20px 20px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:15px;font-weight:600}
.count-badge{font-size:12px;color:#e50914;background:#1a0000;padding:3px 10px;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#1a1a1a;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid #2a2a2a}
.card-poster{width:100%;aspect-ratio:2/3;background:#2a2a2a;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.card-poster img{width:100%;height:100%;object-fit:cover}
.card-emoji{font-size:48px}
.badge{position:absolute;top:8px;right:8px;font-size:10px;padding:3px 8px;border-radius:5px;font-weight:600}
.badge.movie{background:#e50914;color:#fff}
.badge.series{background:#f5a623;color:#000}
.card-body{padding:10px}
.card-name{font-size:13px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:11px;color:#888;margin-bottom:8px}
.watch-btn{width:100%;padding:7px;background:#e50914;border:none;border-radius:7px;color:#fff;font-size:12px;cursor:pointer;font-weight:600}
.empty{text-align:center;padding:50px 20px;color:#444;grid-column:1/-1}
.empty i{font-size:50px;display:block;margin-bottom:12px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:100;padding:20px;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:#181818;border-radius:14px;width:100%;max-width:400px;border:1px solid #2a2a2a;overflow:hidden;position:relative}
.modal-img{width:100%;height:200px;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:60px;overflow:hidden}
.modal-img img{width:100%;height:100%;object-fit:cover}
.modal-body{padding:16px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:6px}
.modal-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.tag{font-size:11px;padding:3px 8px;border-radius:20px;background:#2a2a2a;color:#aaa}
.tag.t{background:#e50914;color:#fff}
.modal-desc{font-size:13px;color:#aaa;line-height:1.6;margin-bottom:14px}
.modal-link{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;background:#e50914;border-radius:10px;color:#fff;font-size:14px;font-weight:600;text-decoration:none}
.close-btn{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.6);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.admin-top{padding:16px 20px;background:#0f0f0f;border-bottom:1px solid #1a1a1a}
.admin-top h2{font-size:15px;font-weight:600;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#1a1a1a;border-radius:10px;padding:10px;text-align:center;border:1px solid #2a2a2a}
.stat-num{font-size:20px;font-weight:700;color:#e50914}
.stat-label{font-size:10px;color:#666;margin-top:2px}
.admin-body{padding:16px}
.sw{display:flex;gap:8px;margin-bottom:14px}
.sw-btn{flex:1;padding:9px;border-radius:8px;border:1px solid #2a2a2a;background:transparent;color:#888;font-size:13px;cursor:pointer;font-family:inherit;text-align:center}
.sw-btn.active{background:#e50914;border-color:#e50914;color:#fff}
.type-sw{display:flex;gap:8px;margin-bottom:14px}
.type-btn{flex:1;padding:10px;border-radius:8px;border:2px solid #2a2a2a;background:#111;color:#888;font-size:13px;cursor:pointer;font-family:inherit}
.type-btn.active{background:#e50914;border-color:#e50914;color:#fff;font-weight:600}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:12px;color:#777;margin-bottom:6px}
.fg input,.fg textarea{width:100%;padding:10px 14px;background:#1a1a1a;border:1px solid #333;border-radius:9px;color:#fff;font-size:14px;outline:none;font-family:inherit}
.fg input:focus,.fg textarea:focus{border-color:#e50914}
.fg textarea{resize:vertical;min-height:70px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add-btn{width:100%;padding:12px;background:#e50914;border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;margin-top:4px}
.add-btn:disabled{background:#555;cursor:not-allowed}
.bulk-box{background:#111;border:2px dashed #2a2a2a;border-radius:10px;padding:12px;margin-bottom:12px}
.bulk-hint{font-size:11px;color:#555;margin-bottom:8px;line-height:1.6}
.bulk-box textarea{width:100%;background:transparent;border:none;color:#ccc;font-family:monospace;font-size:12px;outline:none;resize:vertical;min-height:110px}
.divider{border:none;border-top:1px solid #1a1a1a;margin:18px 0}
.lt{font-size:13px;font-weight:600;margin-bottom:10px;color:#888}
.li{background:#1a1a1a;border-radius:10px;padding:11px;margin-bottom:8px;display:flex;align-items:center;gap:10px;border:1px solid #2a2a2a}
.li-icon{width:36px;height:36px;border-radius:8px;background:#2a0000;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.li-icon i{color:#e50914;font-size:18px}
.li-info{flex:1;min-width:0}
.li-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:11px;color:#666;margin-top:2px}
.del-btn{background:transparent;border:none;color:#444;cursor:pointer;padding:5px;font-size:18px;flex-shrink:0}
.del-btn:hover{color:#e50914}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;display:none;z-index:999;white-space:nowrap}
.toast.s{background:#0d2a0d;color:#4caf50;border:1px solid #1a4a1a}
.toast.e{background:#2a0d0d;color:#f44336;border:1px solid #4a1a1a}
</style>
</head>
<body>
<nav>
  <div class="logo">EXOTIC<span>N9</span></div>
  <div class="nav-tabs">
    <button class="tab active" onclick="showPage('user',this)">🎬 العرض</button>
    <button class="tab" onclick="showPage('admin',this)">⚙️ الإدارة</button>
  </div>
</nav>

<div class="page active" id="page-user">
  <div class="hero"><h1>🎬 أفلام ومسلسلات</h1><p>اكتشف أفضل المحتوى</p></div>
  <div class="search-wrap"><div class="search-box"><input type="text" id="si" placeholder="ابحث..." oninput="fc()"><i class="ti ti-search"></i></div></div>
  <div class="filters">
    <button class="filter-btn active" onclick="sf('all',this)">🌟 الكل</button>
    <button class="filter-btn" onclick="sf('movie',this)">🎬 أفلام</button>
    <button class="filter-btn" onclick="sf('series',this)">📺 مسلسلات</button>
    <button class="filter-btn" onclick="sf('top',this)">⭐ الأعلى</button>
  </div>
  <div class="section">
    <div class="section-header"><div class="section-title">المحتوى</div><div class="count-badge" id="cb">0</div></div>
    <div class="grid" id="grid"><div class="empty"><i class="ti ti-movie"></i><div>لا يوجد محتوى بعد</div><div style="font-size:12px;margin-top:6px">أضف من لوحة الإدارة</div></div></div>
  </div>
</div>

<div class="page" id="page-admin">
  <div class="admin-top">
    <h2>⚙️ لوحة التحكم</h2>
    <div class="stats">
      <div class="stat"><div class="stat-num" id="sm">0</div><div class="stat-label">أفلام</div></div>
      <div class="stat"><div class="stat-num" id="ss">0</div><div class="stat-label">مسلسلات</div></div>
      <div class="stat"><div class="stat-num" id="st">0</div><div class="stat-label">الإجمالي</div></div>
    </div>
  </div>
  <div class="admin-body">
    <div class="sw">
      <button class="sw-btn active" onclick="setTab('single',this)">➕ إضافة واحد</button>
      <button class="sw-btn" onclick="setTab('bulk',this)">📋 إضافة دفعة</button>
    </div>
    <div id="tab-single">
      <div class="type-sw">
        <button class="type-btn active" id="bm" onclick="setType('movie')">🎬 فيلم</button>
        <button class="type-btn" id="bs" onclick="setType('series')">📺 مسلسل</button>
      </div>
      <div class="fg"><label>الاسم *</label><input type="text" id="fn" placeholder="اسم الفيلم أو المسلسل"></div>
      <div class="fr">
        <div class="fg"><label>السنة</label><input type="text" id="fy" placeholder="2024"></div>
        <div class="fg"><label>التقييم</label><input type="text" id="fr2" placeholder="8.5"></div>
      </div>
      <div id="sf2" style="display:none">
        <div class="fr">
          <div class="fg"><label>المواسم</label><input type="text" id="fse" placeholder="3"></div>
          <div class="fg"><label>الحلقات</label><input type="text" id="fep" placeholder="30"></div>
        </div>
      </div>
      <div class="fg"><label>الوصف</label><textarea id="fd" placeholder="وصف مختصر..."></textarea></div>
      <div class="fg"><label>رابط المشاهدة *</label><input type="text" id="fl" placeholder="https://..."></div>
      <div class="fg"><label>رابط الصورة</label><input type="text" id="fp" placeholder="https://...jpg"></div>
      <button class="add-btn" id="ab" onclick="addOne()"><i class="ti ti-plus"></i> إضافة</button>
    </div>
    <div id="tab-bulk" style="display:none">
      <div class="bulk-box">
        <div class="bulk-hint">📌 كل سطر = عنصر واحد:<br><b>الاسم | السنة | التقييم | النوع | الرابط | الوصف</b><br>النوع: movie أو series</div>
        <textarea id="bi" placeholder="The Dark Knight | 2008 | 9.0 | movie | https://... | باتمان يواجه الجوكر
Inception | 2010 | 8.8 | movie | https://... | رحلة داخل الأحلام
Breaking Bad | 2008 | 9.5 | series | https://... | كيميائي يصنع المخدرات"></textarea>
      </div>
      <button class="add-btn" id="bb" onclick="addBulk()"><i class="ti ti-upload"></i> رفع الدفعة</button>
    </div>
    <hr class="divider">
    <div class="lt">📦 المحتوى (<span id="lc">0</span>)</div>
    <div id="al"></div>
  </div>
</div>

<div class="overlay" id="ov" onclick="cm(event)">
  <div class="modal">
    <button class="close-btn" onclick="document.getElementById('ov').classList.remove('show')"><i class="ti ti-x"></i></button>
    <div class="modal-img" id="mi">🎬</div>
    <div class="modal-body">
      <div class="modal-title" id="mt"></div>
      <div class="modal-tags" id="mg"></div>
      <div class="modal-desc" id="md"></div>
      <a class="modal-link" id="ml" href="#" target="_blank"><i class="ti ti-player-play"></i> مشاهدة / تحميل</a>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let db = JSON.parse(localStorage.getItem('en9') || '[]');
let af = 'all', at = 'movie';

function save() { localStorage.setItem('en9', JSON.stringify(db)); }

function showPage(p, btn) {
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.getElementById('page-' + p).classList.add('active');
  btn.classList.add('active');
  if (p === 'admin') ra();
  if (p === 'user') fc();
}

function sf(f, btn) {
  af = f;
  document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
  btn.classList.add('active');
  fc();
}

function fc() {
  const q = document.getElementById('si').value.toLowerCase().trim();
  let items = [...db];
  if (af === 'movie') items = items.filter(x => x.type === 'movie');
  else if (af === 'series') items = items.filter(x => x.type === 'series');
  else if (af === 'top') items = items.filter(x => parseFloat(x.r) >= 8).sort((a,b) => parseFloat(b.r)-parseFloat(a.r));
  if (q) items = items.filter(x => (x.n||'').toLowerCase().includes(q) || (x.d||'').toLowerCase().includes(q));
  rg(items);
}

function rg(items) {
  const g = document.getElementById('grid');
  document.getElementById('cb').textContent = items.length + ' عنصر';
  if (!items.length) {
    g.innerHTML = '<div class="empty"><i class="ti ti-search"></i><div>لا توجد نتائج</div></div>';
    return;
  }
  g.innerHTML = items.map(item => `
    <div class="card" onclick="om(${item.id})">
      <div class="card-poster">
        ${item.p ? `<img src="${item.p}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
        <div class="card-emoji" ${item.p?'style="display:none"':''}>${item.type==='movie'?'🎬':'📺'}</div>
        <div class="badge ${item.type}">${item.type==='movie'?'فيلم':'مسلسل'}</div>
      </div>
      <div class="card-body">
        <div class="card-name">${item.n}</div>
        <div class="card-meta">${item.y||''} ${item.r?'⭐'+item.r:''}</div>
        <button class="watch-btn">▶ مشاهدة</button>
      </div>
    </div>
  `).join('');
}

function om(id) {
  const item = db.find(x => x.id === id);
  if (!item) return;
  const mi = document.getElementById('mi');
  mi.innerHTML = item.p ? `<img src="${item.p}" onerror="this.parentNode.innerHTML='${item.type==='movie'?'🎬':'📺'}'">` : (item.type==='movie'?'🎬':'📺');
  document.getElementById('mt').textContent = item.n;
  let tags = `<span class="tag t">${item.type==='movie'?'🎬 فيلم':'📺 مسلسل'}</span>`;
  if (item.y) tags += `<span class="tag">📅 ${item.y}</span>`;
  if (item.r) tags += `<span class="tag">⭐ ${item.r}/10</span>`;
  if (item.se) tags += `<span class="tag">📂 ${item.se} مواسم</span>`;
  if (item.ep) tags += `<span class="tag">📋 ${item.ep} حلقة</span>`;
  document.getElementById('mg').innerHTML = tags;
  document.getElementById('md').textContent = item.d || 'لا يوجد وصف';
  document.getElementById('ml').href = item.l || '#';
  document.getElementById('ov').classList.add('show');
}

function cm(e) { if (e.target === document.getElementById('ov')) document.getElementById('ov').classList.remove('show'); }

function setTab(t, btn) {
  document.querySelectorAll('.sw .sw-btn').forEach(x => x.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-single').style.display = t==='single'?'block':'none';
  document.getElementById('tab-bulk').style.display = t==='bulk'?'block':'none';
}

function setType(t) {
  at = t;
  document.getElementById('bm').classList.toggle('active', t==='movie');
  document.getElementById('bs').classList.toggle('active', t==='series');
  document.getElementById('sf2').style.display = t==='series'?'block':'none';
}

function addOne() {
  const n = document.getElementById('fn').value.trim();
  const l = document.getElementById('fl').value.trim();
  if (!n) { toast('⚠️ أدخل الاسم', 'e'); return; }
  if (!l) { toast('⚠️ أدخل الرابط', 'e'); return; }
  db.unshift({
    id: Date.now(),
    type: at,
    n, l,
    y: document.getElementById('fy').value.trim(),
    r: document.getElementById('fr2').value.trim(),
    d: document.getElementById('fd').value.trim(),
    p: document.getElementById('fp').value.trim(),
    se: document.getElementById('fse').value.trim(),
    ep: document.getElementById('fep').value.trim()
  });
  save();
  ['fn','fy','fr2','fd','fl','fp','fse','fep'].forEach(id => document.getElementById(id).value = '');
  toast('✅ تم الإضافة!', 's');
  ra(); fc();
}

function addBulk() {
  const lines = document.getElementById('bi').value.split('\n').filter(l => l.trim());
  let added = 0;
  lines.forEach(line => {
    const p = line.split('|').map(x => x.trim());
    if (p[0] && p[4]) {
      db.unshift({ id: Date.now() + added, type: p[3]==='series'?'series':'movie', n:p[0], y:p[1]||'', r:p[2]||'', l:p[4], d:p[5]||'', p:p[6]||'' });
      added++;
    }
  });
  if (!added) { toast('⚠️ تحقق من التنسيق', 'e'); return; }
  save();
  document.getElementById('bi').value = '';
  toast(`✅ تم إضافة ${added} عنصر!`, 's');
  ra(); fc();
}

function del(id) {
  if (!confirm('حذف هذا العنصر؟')) return;
  db = db.filter(x => x.id !== id);
  save(); ra(); fc();
  toast('🗑️ تم الحذف', 's');
}

function ra() {
  document.getElementById('sm').textContent = db.filter(x=>x.type==='movie').length;
  document.getElementById('ss').textContent = db.filter(x=>x.type==='series').length;
  document.getElementById('st').textContent = db.length;
  document.getElementById('lc').textContent = db.length;
  const al = document.getElementById('al');
  if (!db.length) { al.innerHTML = '<div style="text-align:center;padding:24px;color:#555">لا يوجد محتوى بعد</div>'; return; }
  al.innerHTML = db.map(item => `
    <div class="li">
      <div class="li-icon"><i class="ti ${item.type==='movie'?'ti-movie':'ti-device-tv'}"></i></div>
      <div class="li-info">
        <div class="li-name">${item.n}</div>
        <div class="li-sub">${item.type==='movie'?'فيلم':'مسلسل'}${item.y?' • '+item.y:''}${item.r?' • ⭐'+item.r:''}</div>
      </div>
      <button class="del-btn" onclick="del(${item.id})"><i class="ti ti-trash"></i></button>
    </div>
  `).join('');
}

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

fc();
</script>
</body>
</html>
