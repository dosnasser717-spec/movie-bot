<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ExoticN9 | عالم الترفيه</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ff003c; /* لون أحمر سينمائي مميز */
            --bg: #040714; /* لون خلفية ديزني بلس الشهيرة */
            --card-bg: #1a1d29;
            --gradient: linear-gradient(180deg, transparent, rgba(4,7,20,1));
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0; padding: 0;
            overflow-x: hidden;
            width: 100%;
        }

        /* Navbar الاحترافي */
        nav {
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 6%;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            transition: 0.4s;
        }

        .logo { 
            font-size: 1.8rem; 
            font-weight: 800; 
            color: white;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .logo span { color: var(--accent); }

        .nav-links { display: flex; gap: 20px; list-style: none; margin: 0; padding: 0; }
        .nav-links a { 
            color: rgba(255,255,255,0.7); 
            text-decoration: none; font-size: 0.85rem; 
            font-weight: 600; transition: 0.3s;
        }
        .nav-links a:hover { color: white; }

        /* Hero Section الواجهة الرئيسية */
        .hero {
            height: 70vh;
            width: 100%;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 0 6% 50px;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, rgba(4,7,20,0.8), transparent);
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 200px;
            background: var(--gradient);
        }

        .hero-info { position: relative; z-index: 2; max-width: 500px; }
        .hero-info h1 { font-size: 2.2rem; margin: 0; font-weight: 800; }
        .hero-info p { font-size: 0.9rem; color: #ccc; margin: 10px 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        /* Rows & Posters */
        .row { padding: 0 0 0 6%; margin-bottom: 35px; }
        .row h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; color: #f9f9f9; }

        .posters-container {
            display: flex; overflow-x: auto; gap: 15px; padding-bottom: 15px;
            scrollbar-width: none;
        }
        .posters-container::-webkit-scrollbar { display: none; }

        .movie-card {
            min-width: 130px;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            transition: 0.4s cubic-bezier(0.2, 1, 0.2, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .movie-card:hover { transform: scale(1.05); }

        .movie-card img { width: 100%; display: block; border-radius: 10px; }

        .rating {
            position: absolute; top: 8px; right: 8px;
            background: rgba(0,0,0,0.7);
            padding: 2px 6px; border-radius: 4px;
            font-size: 0.7rem; color: #ffc107;
        }

        /* Modal Player */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000; flex-direction: column;
        }
        iframe { width: 100%; height: 85%; border: none; }
        .close-btn { padding: 20px; color: white; font-size: 1.1rem; cursor: pointer; text-align: left; }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hero { height: 50vh; }
            .hero-info h1 { font-size: 1.6rem; }
            .movie-card { min-width: 115px; }
        }
    </style>
</head>
<body>

<nav id="navbar">
    <div class="logo">Exotic<span>N9</span></div>
    <ul class="nav-links">
        <li><a href="#">الرئيسية</a></li>
        <li><a href="#movies">الأفلام</a></li>
        <li><a href="#tv">مسلسلات</a></li>
        <li><a href="#anime">أنمي</a></li>
    </ul>
</nav>

<section class="hero" id="hero-section">
    <div class="hero-info">
        <h1 id="hero-title">جاري التحميل...</h1>
        <p id="hero-desc"></p>
    </div>
</section>

<main>
    <div class="row" id="continue-watching" style="display:none;">
        <h2>متابعة المشاهدة</h2>
        <div class="posters-container" id="continue-row"></div>
    </div>

    <div class="row" id="trending">
        <h2>الأكثر شهرة هذا الأسبوع</h2>
        <div class="posters-container" id="trending-row"></div>
    </div>

    <div class="row" id="movies">
        <h2>أفلام سينمائية</h2>
        <div class="posters-container" id="movie-row"></div>
    </div>

    <div class="row" id="anime">
        <h2>عالم الأنمي</h2>
        <div class="posters-container" id="anime-row"></div>
    </div>
</main>

<div class="modal" id="videoModal">
    <span class="close-btn" onclick="closePlayer()">✕ إغلاق</span>
    <div id="player-container" style="height: 100%;"></div>
</div>

<script>
    const API_KEY = 'c2a4565c270e6801828b769a89614135';
    const IMG = 'https://image.tmdb.org/t/p/w500';
    const BACKDROP = 'https://image.tmdb.org/t/p/original';

    async function fetchData(url, elementId, type = 'movie') {
        const res = await fetch(`https://api.themoviedb.org/3${url}&api_key=${API_KEY}&language=ar`);
        const data = await res.json();
        const container = document.getElementById(elementId);
        
        data.results.forEach(m => {
            if (!m.poster_path) return;
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.onclick = () => openPlayer(m.id, type, m.poster_path, m.title || m.name);
            card.innerHTML = `
                <div class="rating">★ ${m.vote_average.toFixed(1)}</div>
                <img src="${IMG + m.poster_path}" alt="poster">
            `;
            container.appendChild(card);
        });

        if (elementId === 'trending-row') updateHero(data.results[0]);
    }

    function updateHero(m) {
        document.getElementById('hero-section').style.backgroundImage = `url(${BACKDROP + m.backdrop_path})`;
        document.getElementById('hero-title').innerText = m.title || m.name;
        document.getElementById('hero-desc').innerText = m.overview;
    }

    function openPlayer(id, type, poster, title) {
        document.getElementById('videoModal').style.display = 'flex';
        document.getElementById('player-container').innerHTML = 
            `<iframe src="https://vidsrc.me/embed/${type}?tmdb=${id}" allowfullscreen></iframe>`;
        saveHistory(id, type, poster);
    }

    function saveHistory(id, type, poster) {
        let history = JSON.parse(localStorage.getItem('exoticHistory')) || [];
        history = history.filter(h => h.id !== id);
        history.unshift({id, type, poster});
        localStorage.setItem('exoticHistory', JSON.stringify(history.slice(0,10)));
    }

    function closePlayer() {
        document.getElementById('videoModal').style.display = 'none';
        document.getElementById('player-container').innerHTML = '';
    }

    window.onscroll = () => {
        const nav = document.getElementById('navbar');
        if (window.scrollY > 50) nav.style.background = '#040714';
        else nav.style.background = 'transparent';
    };

    window.onload = () => {
        fetchData('/trending/all/day?', 'trending-row');
        fetchData('/discover/movie?with_genres=28', 'movie-row');
        fetchContent(); // لتشغيل الأنمي
        fetchData('/discover/movie?with_genres=16', 'anime-row');
    };
</script>
</body>
</html>
