<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Bot | عالم الترفيه</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #e50914;
            --dark-bg: #0b0e11;
            --card-shadow: 0 8px 15px rgba(0,0,0,0.5);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark-bg);
            color: white;
            margin: 0;
            overflow-x: hidden;
        }

        /* الهيدر - مستوحى من صورتك */
        header {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(to bottom, #141414, transparent);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-red);
            margin-bottom: 20px;
        }

        .search-container {
            margin-bottom: 25px;
        }

        .search-box {
            padding: 12px 25px;
            width: 80%;
            max-width: 500px;
            border-radius: 30px;
            border: 1px solid #333;
            background: #1a1d23;
            color: white;
            font-size: 1rem;
            text-align: center;
        }

        /* الصفوف (Rows) */
        .row {
            padding: 0 4%;
            margin-bottom: 40px;
        }

        .row h2 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            border-right: 4px solid var(--primary-red);
            padding-right: 10px;
        }

        .posters-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 15px;
            scrollbar-width: thin;
        }

        .posters-container::-webkit-scrollbar {
            height: 5px;
        }

        .posters-container::-webkit-scrollbar-thumb {
            background: var(--primary-red);
            border-radius: 10px;
        }

        .movie-card {
            min-width: 150px;
            transition: 0.3s ease;
            cursor: pointer;
        }

        .movie-card:hover {
            transform: scale(1.08);
        }

        .movie-card img {
            width: 100%;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
        }

        /* مشغل الفيديو */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content { width: 90%; height: 80%; position: relative; }
        iframe { width: 100%; height: 100%; border: none; border-radius: 15px; }
        .close-btn { position: absolute; top: -40px; left: 0; color: white; font-size: 30px; cursor: pointer; }

    </style>
</head>
<body>

<header>
    <div class="logo">🤖 MOVIE BOT</div>
    <div class="search-container">
        <input type="text" id="search" class="search-box" placeholder="ابحث عن فيلم، مسلسل، أو أنمي...">
    </div>
</header>

<div class="row">
    <h2>أفلام تريند 🔥</h2>
    <div class="posters-container" id="trending-row"></div>
</div>

<div class="row">
    <h2>أفلام الرعب 👻</h2>
    <div class="posters-container" id="horror-row"></div>
</div>

<div class="row">
    <h2>عالم الأنمي 🐉</h2>
    <div class="posters-container" id="anime-row"></div>
</div>

<div class="row">
    <h2>أفلام كوميدية 🍿</h2>
    <div class="posters-container" id="comedy-row"></div>
</div>

<div class="row">
    <h2>مسلسلات 📺</h2>
    <div class="posters-container" id="tv-row"></div>
</div>

<div class="modal" id="videoModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closePlayer()">&times;</span>
        <div id="player-container" style="height: 100%;"></div>
    </div>
</div>

<script>
    const API_KEY = 'c2a4565c270e6801828b769a89614135';
    const BASE_URL = 'https://api.themoviedb.org/3';

    // وظيفة جلب البيانات
    async function fetchSection(url, elementId, type = 'movie') {
        const res = await fetch(`${BASE_URL}${url}&api_key=${API_KEY}&language=ar`);
        const data = await res.json();
        const container = document.getElementById(elementId);

        data.results.forEach(item => {
            if (!item.poster_path) return;
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.onclick = () => openPlayer(item.id, type);
            card.innerHTML = `<img src="https://image.tmdb.org/t/p/w300${item.poster_path}" alt="${item.title || item.name}">`;
            container.appendChild(card);
        });
    }

    // وظيفة المشغل
    function openPlayer(id, type) {
        document.getElementById('videoModal').style.display = 'flex';
        document.getElementById('player-container').innerHTML = 
            `<iframe src="https://vidsrc.me/embed/${type}?tmdb=${id}" allowfullscreen></iframe>`;
    }

    function closePlayer() {
        document.getElementById('videoModal').style.display = 'none';
        document.getElementById('player-container').innerHTML = '';
    }

    // تحميل الأقسام عند الفتح
    window.onload = () => {
        fetchSection('/trending/all/week?', 'trending-row');
        fetchSection('/discover/movie?with_genres=27', 'horror-row'); // رعب
        fetchSection('/discover/movie?with_genres=16', 'anime-row');  // أنمي
        fetchSection('/discover/movie?with_genres=35', 'comedy-row'); // كوميدي
        fetchSection('/discover/tv?sort_by=popularity.desc', 'tv-row', 'tv'); // مسلسلات
    };

    // برمجة البحث
    document.getElementById('search').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            const query = this.value;
            if(query) {
                window.open(`https://www.themoviedb.org/search?query=${query}`, '_blank');
            }
        }
    });
</script>

</body>
</html>
