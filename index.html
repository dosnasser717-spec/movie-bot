<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ExoticN9 | عالم الترفيه</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ff003c;
            --bg: #040714;
            --nav-bg: rgba(4, 7, 20, 0.95);
            --text-color: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text-color); margin: 0; overflow-x: hidden; width: 100%;
        }

        /* --- القائمة الرئيسية (Navbar) المحدثة --- */
        nav {
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 5%; position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            transition: background 0.3s ease;
        }
        
        .nav-right { display: flex; align-items: center; gap: 30px; }

        .logo { font-size: 1.6rem; font-weight: 800; color: white; letter-spacing: 1px; text-decoration: none; }
        .logo span { color: var(--accent); }

        .main-menu { display: flex; list-style: none; gap: 20px; margin: 0; padding: 0; }
        .main-menu a { 
            color: #ccc; text-decoration: none; font-size: 0.9rem; font-weight: 600; 
            transition: 0.3s;
        }
        .main-menu a:hover { color: white; }

        /* Hero Section */
        .hero {
            height: 70vh; width: 100%; background-size: cover; background-position: center;
            display: flex; align-items: center; padding: 0 5%; position: relative;
        }
        .hero::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, rgba(4,7,20,0.8), transparent 60%);
        }
        .hero::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 200px;
            background: linear-gradient(to top, var(--bg), transparent);
        }
        .hero-info { position: relative; z-index: 2; max-width: 550px; margin-top: 50px; }
        .hero-info h1 { font-size: 2.2rem; margin: 0 0 10px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.7); }
        
        .hero-play-btn {
            display: inline-flex; align-items: center; gap: 10px;
            background-color: white; color: black;
            padding: 12px 25px; border-radius: 8px;
            font-weight: 700; text-decoration: none;
            margin-top: 15px; cursor: pointer;
            transition: 0.3s ease;
        }
        .hero-play-btn:hover { background-color: var(--accent); color: white; transform: scale(1.05); }

        /* Rows */
        .row { padding: 0 0 0 5%; margin-bottom: 30px; scroll-margin-top: 100px; }
        .row h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; border-right: 4px solid var(--accent); padding-right: 10px; }

        .posters-container {
            display: flex; overflow-x: auto; gap: 12px; padding-bottom: 15px; scrollbar-width: none;
        }
        .posters-container::-webkit-scrollbar { display: none; }

        /* Cards */
        .movie-card {
            min-width: 130px; position: relative; border-radius: 12px; overflow: hidden;
            transition: 0.3s ease; box-shadow: 0 8px 15px rgba(0,0,0,0.4); cursor: pointer;
        }
        .movie-card.mini { min-width: 85px; max-width: 85px; border-radius: 6px; }
        .movie-card img { width: 100%; display: block; transition: 0.5s; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(229, 9, 20, 0.7), transparent); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: 0.3s;
        }
        .movie-card:hover .overlay { opacity: 1; }
        
        .play-icon {
            background: white; color: black; border-radius: 50%; width: 35px; height: 35px;
            display: flex; align-items: center; justify-content: center; font-size: 1rem;
        }
        .remove-btn {
            position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.8); color: white;
            width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 12px; z-index: 10;
        }

        .rating-tag {
            position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.8);
            padding: 2px 5px; border-radius: 4px; font-size: 0.6rem; color: #ffc107; z-index: 5;
        }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000; flex-direction: column;
        }
        iframe { width: 100%; height: 100%; border: none; }
        .close-btn { padding: 12px; color: white; cursor: pointer; background: #111; text-align: center; font-weight: bold; }

        /* Responsive Navbar */
        @media (max-width: 768px) {
            .main-menu { display: none; } /* إخفاء القائمة في الجوال لترك مساحة للشعار */
            .hero { height: 50vh; }
            .hero-info h1 { font-size: 1.5rem; }
            .movie-card { min-width: 110px; }
        }
    </style>
</head>
<body>

<nav id="navbar">
    <div class="nav-right">
        <a href="#" class="logo">Exotic<span>N9</span></a>
        <ul class="main-menu">
            <li><a href="#">الرئيسية</a></li>
            <li><a href="#trending-section">تصفح</a></li>
            <li><a href="#movies-2026">الأفلام</a></li>
            <li><a href="#tv-section">المسلسلات</a></li>
            <li><a href="#anime-section">الأنمي</a></li>
        </ul>
    </div>
</nav>

<section class="hero" id="hero-section">
    <div class="hero-info">
        <h1 id="hero-title">تحميل...</h1>
        <div id="hero-play-container"></div>
    </div>
</section>

<main>
    <div class="row" id="history-section" style="display:none;">
        <h2 style="font-size: 0.9rem; color: #aaa; border: none;">تابع من حيث توقفت 🕒</h2>
        <div class="posters-container" id="history-row" style="gap: 8px;"></div>
    </div>

    <div class="row" id="movies-2026">
        <h2>أفلام 2026 🆕</h2>
        <div class="posters-container" id="2026-row"></div>
    </div>

    <div class="row">
        <h2>أفلام 2025 🎬</h2>
        <div class="posters-container" id="2025-row"></div>
    </div>

    <div class="row" id="tv-section">
        <h2>المسلسلات الأعلى مشاهدة 📈</h2>
        <div class="posters-container" id="top-tv-row"></div>
    </div>

    <div class="row" id="trending-section">
        <h2>الأكثر شهرة الآن 🔥</h2>
        <div class="posters-container" id="trending-row"></div>
    </div>

    <div class="row" id="anime-section">
        <h2>عالم الأنمي 🐉</h2>
        <div class="posters-container" id="anime-row"></div>
    </div>
</main>

<div class="modal" id="videoModal">
    <div class="close-btn" onclick="closePlayer()">✕ إغلاق</div>
    <div id="player-container" style="flex:1;"></div>
</div>

<script>
    const API_KEY = 'c2a4565c270e6801828b769a89614135';
    const IMG = 'https://image.tmdb.org/t/p/w342';
    const B_IMG = 'https://image.tmdb.org/t/p/original';

    async function fetchList(url, elementId, type = 'movie') {
        try {
            const res = await fetch(`https://api.themoviedb.org/3${url}&api_key=${API_KEY}&language=ar&page=1`);
            const data = await res.json();
            const container = document.getElementById(elementId);
            
            data.results.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openPlayer(m.id, type, m.poster_path);
                card.innerHTML = `
                    <div class="rating-tag">★ ${m.vote_average.toFixed(1)}</div>
                    <img src="${IMG + m.poster_path}" alt="poster" loading="lazy">
                    <div class="overlay"><div class="play-icon">▶</div></div>
                `;
                container.appendChild(card);
            });

            if (elementId === '2026-row' && data.results[0]) {
                updateHero(data.results[0], type);
            }
        } catch (e) { console.error("Error fetching data"); }
    }

    function updateHero(m, type) {
        document.getElementById('hero-section').style.backgroundImage = `url(${B_IMG + m.backdrop_path})`;
        document.getElementById('hero-title').innerText = m.title || m.name;
        document.getElementById('hero-play-container').innerHTML = `
            <div class="hero-play-btn" onclick="openPlayer(${m.id}, '${type}', '${m.poster_path}')">▶ المشاهدة الآن</div>
        `;
    }

    function openPlayer(id, type, poster) {
        document.getElementById('videoModal').style.display = 'flex';
        document.getElementById('player-container').innerHTML = `<iframe src="https://vidsrc.me/embed/${type}?tmdb=${id}" allowfullscreen></iframe>`;
        saveHistory(id, type, poster);
    }

    function saveHistory(id, type, poster) {
        let history = JSON.parse(localStorage.getItem('exoticHistory')) || [];
        history = history.filter(h => h.id !== id);
        history.unshift({id, type, poster});
        localStorage.setItem('exoticHistory', JSON.stringify(history.slice(0,15)));
        loadHistory();
    }

    function removeFromHistory(event, id) {
        event.stopPropagation();
        let history = JSON.parse(localStorage.getItem('exoticHistory')) || [];
        history = history.filter(h => h.id !== id);
        localStorage.setItem('exoticHistory', JSON.stringify(history));
        loadHistory();
    }

    function loadHistory() {
        const history = JSON.parse(localStorage.getItem('exoticHistory')) || [];
        const section = document.getElementById('history-section');
        const row = document.getElementById('history-row');
        if (history.length > 0) {
            section.style.display = 'block';
            row.innerHTML = '';
            history.forEach(m => {
                const card = document.createElement('div');
                card.className = 'movie-card mini';
                card.onclick = () => openPlayer(m.id, m.type, m.poster);
                card.innerHTML = `<div class="remove-btn" onclick="removeFromHistory(event, ${m.id})">✕</div><img src="${IMG + m.poster}"><div class="overlay"><div class="play-icon">▶</div></div>`;
                row.appendChild(card);
            });
        } else { section.style.display = 'none'; }
    }

    function closePlayer() {
        document.getElementById('videoModal').style.display = 'none';
        document.getElementById('player-container').innerHTML = '';
    }

    // تغيير لون الناف بار عند النزول
    window.onscroll = function() {
        const nav = document.getElementById('navbar');
        if (window.scrollY > 50) nav.style.background = "var(--nav-bg)";
        else nav.style.background = "transparent";
    };

    window.onload = () => {
        loadHistory();
        fetchList('/discover/movie?primary_release_year=2026&sort_by=popularity.desc', '2026-row');
        fetchList('/discover/movie?primary_release_year=2025&sort_by=popularity.desc', '2025-row');
        fetchList('/tv/top_rated?', 'top-tv-row', 'tv');
        fetchList('/trending/all/day?', 'trending-row');
        fetchList('/discover/movie?with_genres=16', 'anime-row');
    };
</script>
</body>
</html>
