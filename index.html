<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movie Bot | عالم الترفيه</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #e50914;
            --dark-bg: #06090f;
            --card-bg: #141414;
        }

        /* إصلاح مشكلة العرض */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark-bg);
            color: white;
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* يمنع الصفحة من التحرك يميناً ويساراً */
            width: 100%;
        }

        /* شريط التنقل - تم إصلاحه ليكون متوافقاً 100% */
        nav {
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid #222;
        }

        .nav-links { 
            display: flex; 
            gap: 15px; 
            list-style: none; 
            margin: 0; 
            padding: 0; 
            overflow-x: auto;
            white-space: nowrap;
            max-width: 70%; /* لترك مساحة للوجو */
        }
        
        .nav-links::-webkit-scrollbar { display: none; }

        .nav-links a { 
            color: #bbb; 
            text-decoration: none; 
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* الهيدر والبحث */
        header {
            text-align: center;
            padding: 90px 15px 20px;
            background: linear-gradient(to bottom, #141414, transparent);
        }

        .logo { 
            font-size: 1.6rem; 
            font-weight: bold; 
            color: var(--primary-red); 
            margin-bottom: 15px; 
        }

        .search-box {
            padding: 10px 15px; 
            width: 100%; 
            max-width: 350px;
            border-radius: 20px; 
            border: 1px solid #333;
            background: #1a1d23; 
            color: white; 
            font-size: 0.8rem;
            text-align: center;
        }

        /* الصفوف - تم ضبطها لتكون داخل إطار الشاشة */
        .row { 
            padding: 0 15px; 
            margin-bottom: 25px; 
            width: 100%;
        }
        
        .row h2 { 
            font-size: 0.95rem; 
            margin-bottom: 12px; 
            border-right: 3px solid var(--primary-red); 
            padding-right: 8px; 
        }
        
        .posters-container {
            display: flex; 
            overflow-x: auto; 
            gap: 12px; 
            padding-bottom: 10px;
            width: 100%;
            -webkit-overflow-scrolling: touch;
        }
        .posters-container::-webkit-scrollbar { display: none; }

        .movie-card { 
            min-width: 105px; /* حجم مثالي للجوال */
            max-width: 105px;
        }
        
        .movie-card img { 
            width: 100%; 
            border-radius: 8px; 
            display: block;
        }

        /* المشغل - ملء الشاشة للجوال */
        .modal {
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            background: #000; 
            z-index: 2000; 
            flex-direction: column;
        }
        
        .modal-content { 
            width: 100%; 
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        iframe { width: 100%; height: 80%; border: none; }
        
        .close-btn { 
            padding: 15px;
            color: white; 
            font-size: 30px; 
            cursor: pointer; 
            align-self: flex-start;
        }

    </style>
</head>
<body>

<nav>
    <div class="logo" style="font-size: 1.2rem;">BOT</div>
    <ul class="nav-links">
        <li><a href="#trending">أحدث الأفلام</a></li>
        <li><a href="#movies">الأفلام</a></li>
        <li><a href="#tv">المسلسلات</a></li>
        <li><a href="#anime">الأنمي</a></li>
        <li><a href="#horror">الرعب</a></li>
    </ul>
</nav>

<header>
    <div class="logo">🤖 MOVIE BOT</div>
    <input type="text" id="search" class="search-box" placeholder="ابحث هنا...">
</header>

<main>
    <div class="row" id="continue-watching-section" style="display: none;">
        <h2>متابعة المشاهدة 🕒</h2>
        <div class="posters-container" id="continue-row"></div>
    </div>

    <div class="row" id="trending">
        <h2>أحدث الأفلام والتريند 🔥</h2>
        <div class="posters-container" id="trending-row"></div>
    </div>

    <div class="row" id="movies">
        <h2>أفلام مختارة 🎬</h2>
        <div class="posters-container" id="movie-row"></div>
    </div>

    <div class="row" id="tv">
        <h2>المسلسلات 📺</h2>
        <div class="posters-container" id="tv-row"></div>
    </div>

    <div class="row" id="anime">
        <h2>عالم الأنمي 🐉</h2>
        <div class="posters-container" id="anime-row"></div>
    </div>

    <div class="row" id="horror">
        <h2>أفلام الرعب 👻</h2>
        <div class="posters-container" id="horror-row"></div>
    </div>
</main>

<div class="modal" id="videoModal">
    <span class="close-btn" onclick="closePlayer()">✕ إغلاق</span>
    <div class="modal-content">
        <div id="player-container" style="width: 100%; height: 100%;"></div>
    </div>
</div>

<script>
    const API_KEY = 'c2a4565c270e6801828b769a89614135';
    const BASE_URL = 'https://api.themoviedb.org/3';

    async function fetchRow(url, elementId, type = 'movie') {
        const res = await fetch(`${BASE_URL}${url}&api_key=${API_KEY}&language=ar`);
        const data = await res.json();
        renderMovies(data.results, elementId, type);
    }

    function renderMovies(movies, elementId, type) {
        const container = document.getElementById(elementId);
        movies.forEach(item => {
            if (!item.poster_path) return;
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.onclick = () => openPlayer(item.id, type, item.poster_path, item.title || item.name);
            card.innerHTML = `<img src="https://image.tmdb.org/t/p/w185${item.poster_path}" alt="movie">`;
            container.appendChild(card);
        });
    }

    function addToHistory(id, type, poster, title) {
        let history = JSON.parse(localStorage.getItem('movieHistory')) || [];
        history = history.filter(item => item.id !== id);
        history.unshift({ id, type, poster, title });
        localStorage.setItem('movieHistory', JSON.stringify(history.slice(0, 10)));
        loadHistory();
    }

    function loadHistory() {
        const history = JSON.parse(localStorage.getItem('movieHistory')) || [];
        const section = document.getElementById('continue-watching-section');
        const container = document.getElementById('continue-row');
        if (history.length > 0) {
            section.style.display = 'block';
            container.innerHTML = '';
            history.forEach(item => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openPlayer(item.id, item.type, item.poster, item.title);
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w185${item.poster}">`;
                container.appendChild(card);
            });
        }
    }

    function openPlayer(id, type, poster, title) {
        document.getElementById('videoModal').style.display = 'flex';
        document.getElementById('player-container').innerHTML = 
            `<iframe src="https://vidsrc.me/embed/${type}?tmdb=${id}" allowfullscreen></iframe>`;
        addToHistory(id, type, poster, title);
    }

    function closePlayer() {
        document.getElementById('videoModal').style.display = 'none';
        document.getElementById('player-container').innerHTML = '';
    }

    window.onload = () => {
        loadHistory();
        fetchRow('/trending/all/week?', 'trending-row');
        fetchRow('/discover/movie?sort_by=popularity.desc', 'movie-row');
        fetchRow('/discover/tv?sort_by=popularity.desc', 'tv-row', 'tv');
        fetchRow('/discover/movie?with_genres=16', 'anime-row');
        fetchRow('/discover/movie?with_genres=27', 'horror-row');
    };
</script>
</body>
</html>
