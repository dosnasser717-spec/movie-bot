<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ExoticN9 | عالم الترفيه</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ff003c;
            --bg: #040714;
            --card-bg: #1a1d29;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: white; margin: 0; overflow-x: hidden; width: 100%;
        }

        /* Navbar */
        nav {
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 5%; position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
        }
        .logo { font-size: 1.6rem; font-weight: 800; color: white; letter-spacing: 1px; }
        .logo span { color: var(--accent); }

        /* Hero */
        .hero {
            height: 60vh; width: 100%; background-size: cover; background-position: center;
            display: flex; align-items: flex-end; padding: 0 5% 40px; position: relative;
        }
        .hero::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 150px;
            background: linear-gradient(to top, var(--bg), transparent);
        }
        .hero-info { position: relative; z-index: 2; max-width: 600px; }
        .hero-info h1 { font-size: 1.8rem; margin: 0; }

        /* Rows */
        .row { padding: 0 0 0 5%; margin-bottom: 30px; }
        .row h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; border-right: 4px solid var(--accent); padding-right: 10px; }

        .posters-container {
            display: flex; overflow-x: auto; gap: 12px; padding-bottom: 15px; scrollbar-width: none;
        }
        .posters-container::-webkit-scrollbar { display: none; }

        /* Movie Card with Watch Overlay */
        .movie-card {
            min-width: 125px; position: relative; border-radius: 12px; overflow: hidden;
            transition: 0.3s ease; box-shadow: 0 8px 15px rgba(0,0,0,0.4);
        }

        .movie-card img { width: 100%; display: block; transition: 0.5s; }

        /* طبقة "مشاهدة" تظهر عند اللمس/المرور */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 60, 0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: 0.3s;
        }
        .movie-card:hover .overlay, .movie-card:active .overlay { opacity: 1; }
        .movie-card:hover img { transform: scale(1.1); filter: blur(2px); }

        .play-btn {
            background: white; color: black; border-radius: 50%; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            margin-bottom: 8px; box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        .watch-text { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }

        .rating-tag {
            position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.8);
            padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; color: #ffc107; z-index: 5;
        }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000; flex-direction: column;
        }
        iframe { width: 100%; height: 100%; border: none; }
        .close-btn { padding: 15px; color: white; font-size: 1.1rem; cursor: pointer; background: #111; }

    </style>
</head>
<body>

<nav>
    <div class="logo">Exotic<span>N9</span></div>
</nav>

<section class="hero" id="hero-section">
    <div class="hero-info">
        <h1 id="hero-title">تحميل العروض...</h1>
    </div>
</section>

<main>
    <div class="row" id="history-section" style="display:none;">
        <h2>تابع من حيث توقفت 🕒</h2>
        <div class="posters-container" id="history-row"></div>
    </div>

    <div class="row">
        <h2>الأكثر شهرة الآن 🔥</h2>
        <div class="posters-container" id="trending-row"></div>
    </div>

    <div class="row">
        <h2>أفلام الأكشن والإثارة 💥</h2>
        <div class="posters-container" id="action-row"></div>
    </div>

    <div class="row">
        <h2>مسلسلات مختارة 📺</h2>
        <div class="posters-container" id="tv-row"></div>
    </div>

    <div class="row">
        <h2>عالم الأنمي 🐉</h2>
        <div class="posters-container" id="anime-row"></div>
    </div>

    <div class="row">
        <h2>أفلام الرعب 💀</h2>
        <div class="posters-container" id="horror-row"></div>
    </div>

    <div class="row">
        <h2>أفلام كوميدية 🍿</h2>
        <div class="posters-container" id="comedy-row"></div>
    </div>
</main>

<div class="modal" id="videoModal">
    <div class="close-btn" onclick="closePlayer()">✕ إغلاق والعودة للقائمة</div>
    <div id="player-container" style="flex:1;"></div>
</div>

<script>
    const API_KEY = 'c2a4565c270e6801828b769a89614135';
    const IMG = 'https://image.tmdb.org/t/p/w342';
    const B_IMG = 'https://image.tmdb.org/t/p/original';

    async function fetchList(url, elementId, type = 'movie') {
        const res = await fetch(`https://api.themoviedb.org/3${url}&api_key=${API_KEY}&language=ar&page=1`);
        const data = await res.json();
        const container = document.getElementById(elementId);
        
        data.results.forEach(m => {
            if (!m.poster_path) return;
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.onclick = () => openPlayer(m.id, type, m.poster_path);
            card.innerHTML = `
                <div class="rating-tag">★ ${m.vote_average.toFixed(1)}</div>
                <img src="${IMG + m.poster_path}" alt="poster">
                <div class="overlay">
                    <div class="play-btn">▶</div>
                    <div class="watch-text">مشاهدة</div>
                </div>
            `;
            container.appendChild(card);
        });

        if (elementId === 'trending-row') {
            const h = data.results[0];
            document.getElementById('hero-section').style.backgroundImage = `url(${B_IMG + h.backdrop_path})`;
            document.getElementById('hero-title').innerText = h.title || h.name;
        }
    }

    function openPlayer(id, type, poster) {
        document.getElementById('videoModal').style.display = 'flex';
        document.getElementById('player-container').innerHTML = 
            `<iframe src="https://vidsrc.me/embed/${type}?tmdb=${id}" allowfullscreen></iframe>`;
        saveHistory(id, type, poster);
    }

    function saveHistory(id, type, poster) {
        let history = JSON.parse(localStorage.getItem('exoticHistory')) || [];
        history = history.filter(h => h.id !== id);
        history.unshift({id, type, poster});
        localStorage.setItem('exoticHistory', JSON.stringify(history.slice(0,10)));
        loadHistory();
    }

    function loadHistory() {
        const history = JSON.parse(localStorage.getItem('exoticHistory')) || [];
        if (history.length > 0) {
            document.getElementById('history-section').style.display = 'block';
            const row = document.getElementById('history-row');
            row.innerHTML = '';
            history.forEach(m => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openPlayer(m.id, m.type, m.poster);
                card.innerHTML = `<img src="${IMG + m.poster}"><div class="overlay"><div class="play-btn">▶</div></div>`;
                row.appendChild(card);
            });
        }
    }

    function closePlayer() {
        document.getElementById('videoModal').style.display = 'none';
        document.getElementById('player-container').innerHTML = '';
    }

    window.onload = () => {
        loadHistory();
        fetchList('/trending/all/day?', 'trending-row');
        fetchList('/discover/movie?with_genres=28', 'action-row');
        fetchList('/discover/tv?sort_by=popularity.desc', 'tv-row', 'tv');
        fetchList('/discover/movie?with_genres=16', 'anime-row');
        fetchList('/discover/movie?with_genres=27', 'horror-row');
        fetchList('/discover/movie?with_genres=35', 'comedy-row');
    };
</script>
</body>
</html>
